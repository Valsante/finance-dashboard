<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMT Finanz-Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
 --acc:#5b7ff9;--accsoft:rgba(91,127,249,.14);--red:#c96a6a;--green:#5da97c;--amber:#c99a5b;
 --bg:#f1f3f8;--txt:#1a2233;--mut:#7b869c;
 --glass:rgba(255,255,255,.62);--inbg:rgba(26,34,51,.05);--hover:rgba(26,34,51,.04);
 --line:rgba(123,134,156,.14);--chip:rgba(91,127,249,.10);--chiptxt:#4a67d4;
 --shadow:0 24px 60px -28px rgba(26,34,51,.22);
 --shadow2:0 34px 70px -30px rgba(26,34,51,.30);
}
[data-theme="dark"]{
 --acc:#8ba7ff;--accsoft:rgba(139,167,255,.14);--red:#d99191;--green:#84c39c;--amber:#d9b078;
 --bg:#0c111e;--txt:#e4e9f2;--mut:#8b96ab;
 --glass:rgba(24,31,50,.55);--inbg:rgba(255,255,255,.055);--hover:rgba(255,255,255,.045);
 --line:rgba(139,150,171,.12);--chip:rgba(139,167,255,.13);--chiptxt:#a9bcff;
 --shadow:0 24px 60px -28px rgba(0,0,0,.55);
 --shadow2:0 34px 70px -30px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;min-height:100vh}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38}
.bgfx i:nth-child(1){width:600px;height:600px;background:#b8c6ea;top:-180px;left:-120px;animation:fl1 34s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:520px;height:520px;background:#bdd8d1;top:14%;right:-160px;animation:fl2 40s ease-in-out infinite alternate}
.bgfx i:nth-child(3){width:560px;height:560px;background:#cfc8e8;bottom:-220px;left:32%;animation:fl3 46s ease-in-out infinite alternate}
[data-theme="dark"] .bgfx i{opacity:.10}
@keyframes fl1{to{transform:translate(80px,60px) scale(1.12)}}
@keyframes fl2{to{transform:translate(-70px,80px) scale(1.07)}}
@keyframes fl3{to{transform:translate(60px,-70px) scale(1.14)}}
@media (prefers-reduced-motion:reduce){.bgfx i{animation:none}}
header{background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);color:var(--txt);padding:13px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:16.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
header .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;background:var(--inbg);border-radius:14px;padding:3px}
nav button{background:transparent;border:0;color:var(--mut);padding:7px 12px;border-radius:11px;cursor:pointer;font-size:12.5px;font-weight:600;transition:all .2s ease}
nav button:hover{color:var(--txt)}
nav button.act{background:var(--glass);color:var(--acc);font-weight:800;box-shadow:0 6px 18px -6px rgba(26,34,51,.25)}
#themeBtn{background:var(--inbg);border:0;color:var(--txt);border-radius:12px;padding:7px 11px;cursor:pointer;font-size:14px;transition:.2s}
#themeBtn:hover{background:var(--accsoft)}
main{max-width:1280px;margin:0 auto;padding:16px 18px 70px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}
.toolbar .lbl{font-size:10.5px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.seg{display:flex;background:var(--inbg);border-radius:13px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;cursor:pointer;font-size:12.5px;color:var(--mut);font-weight:600;border-radius:10px;transition:all .18s}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--glass);color:var(--acc);font-weight:800;box-shadow:0 5px 14px -5px rgba(26,34,51,.28)}
.tglbtn{border:0;background:var(--inbg);color:var(--mut);padding:8px 15px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .18s}
.tglbtn.on{background:var(--accsoft);color:var(--acc)}
select,input[type=text],input[type=search],input[type=number]{padding:8px 12px;border:0;border-radius:12px;font-size:13px;background:var(--inbg);color:var(--txt);outline:none;transition:.15s}
select:focus,input:focus{box-shadow:0 0 0 3px var(--accsoft)}
select option{background:var(--bg);color:var(--txt)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(390px,1fr))}
.card{background:var(--glass);border:0;border-radius:26px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.card:has(table):hover,.card:has(.chartbox):hover{transform:none}
.card h3{font-size:11px;color:var(--mut);font-weight:800;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:6px}
.kpi{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--txt)}
.kpi small{font-size:12px;font-weight:600;color:var(--mut)}
.delta{font-size:12px;font-weight:600;margin-top:3px}
.spark{width:100%;height:36px;margin-top:10px;display:block}
.pos{color:var(--green)}.neg{color:var(--red)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:800;padding:7px 10px;border:0;white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
td{padding:8.5px 10px;border:0;vertical-align:middle}
tbody tr{transition:background .12s}
tr:hover td{background:var(--hover)}
tr:hover td:first-child{border-radius:12px 0 0 12px}
tr:hover td:last-child{border-radius:0 12px 12px 0}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sub td{color:var(--mut);font-size:12.5px;padding-top:4px;padding-bottom:4px}
tr.sub td:first-child{padding-left:34px}
.tag{display:inline-block;padding:2.5px 10px;border-radius:12px;font-size:11px;background:var(--chip);color:var(--chiptxt);white-space:nowrap;font-weight:700}
.bar{height:6px;border-radius:4px;background:var(--inbg);position:relative;overflow:hidden;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px;transition:width .6s ease}
.bar.warn i{background:var(--red)}
.view{display:none;animation:fade .3s ease}
.view.act{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.controls input[type=search]{min-width:230px}
#drop{border:0;border-radius:22px;padding:42px;text-align:center;color:var(--mut);background:var(--inbg);transition:.2s;cursor:pointer}
#drop.over{background:var(--accsoft);transform:scale(1.01)}
#drop b{color:var(--txt);font-size:15px}
.btn{background:var(--acc);color:#fff;border:0;padding:9px 18px;border-radius:13px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 10px 24px -10px var(--acc);transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.sec{background:var(--inbg);color:var(--txt);box-shadow:none}
.btn.danger{background:rgba(201,106,106,.14);color:var(--red);box-shadow:none}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.55}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--inbg);color:var(--txt);padding:5px 13px;border-radius:999px;font-size:12px;margin:2px;font-weight:600;transition:.15s}
.pill.warn{background:rgba(201,106,106,.12);color:var(--red)}
.pill.info{background:var(--chip);color:var(--chiptxt)}
.pill.clickable:hover{transform:translateY(-1px)}
.pager{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;flex-wrap:wrap}
.pager button{padding:5px 13px;border:0;background:var(--inbg);color:var(--txt);border-radius:10px;cursor:pointer}
h2.sec{font-size:15px;margin:20px 0 10px;font-weight:800}
.chartbox{position:relative;height:320px}
.chartbox.sm{position:relative;height:210px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--mut)}
#toast{position:fixed;bottom:18px;right:18px;background:var(--glass);color:var(--txt);backdrop-filter:blur(24px);padding:13px 19px;border-radius:16px;display:none;z-index:99;max-width:440px;font-size:13px;box-shadow:var(--shadow2)}
#saveHint{position:fixed;bottom:18px;left:18px;z-index:98;display:none}
.exp{cursor:pointer;user-select:none}
.exp:before{content:'▸';color:var(--mut);display:inline-block;width:14px;transition:transform .15s}
.exp.open:before{content:'▾'}
.heat{border-collapse:separate;border-spacing:2px}
.heat td{border:0;padding:0;width:22px;height:20px;border-radius:6px;text-align:center;font-size:9.5px;color:var(--mut)}
.heat th{border:0;font-size:10px;padding:2px 4px}
.clickable{cursor:pointer}
dialog{border:0;border-radius:24px;padding:0;max-width:430px;width:92%;box-shadow:var(--shadow2);background:var(--glass);color:var(--txt);backdrop-filter:blur(32px) saturate(150%);-webkit-backdrop-filter:blur(32px) saturate(150%)}
dialog::backdrop{background:rgba(10,15,28,.45);backdrop-filter:blur(5px)}
.dlgBody{padding:22px}
.dlgBody h3{font-size:15px;margin-bottom:12px}
.dlgBody label{font-size:10.5px;color:var(--mut);font-weight:800;display:block;margin:11px 0 4px;text-transform:uppercase;letter-spacing:.6px}
.dlgBody select,.dlgBody input{width:100%}
.dlgRow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
input[type=number].bud{width:110px;text-align:right}
.mut{color:var(--mut)}
.big-num{font-variant-numeric:tabular-nums}
svg{vertical-align:-1.5px}
html{scrollbar-width:thin;scrollbar-color:rgba(123,134,156,.35) transparent}
::-webkit-scrollbar{height:7px;width:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(123,134,156,.28);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(123,134,156,.5)}
.card{scrollbar-width:thin;scrollbar-color:rgba(123,134,156,.3) transparent}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 .card,header,dialog,#toast{background:var(--bg)}
 [data-theme="dark"] .card{background:#141b2e}
}
@media(max-width:720px){ nav{width:100%;order:3} header{padding:10px 12px} main{padding:12px} }
</style>
</head>

function merchantRaw(info, cp){
  let m = info.match(/(?:Einkauf Debitkarte|Gutschrift|Bancomat|Bezug)\s+\d\d\.\d\d\.\d{4} \d\d:\d\d\s+(.*?)\s*Kartennummer/);
  if(m) return m[1].trim();
  m = info.match(/TWINT (?:Belastung|Gutschrift)\s*,?\s*(.*)/);
  if(m) return m[1].replace(/\s*\d{10,}\s*$/,'').replace(/\+41\d+/,'').replace(/[ ,]+$/,'').trim();
  if(cp) return cp.trim();
  m = info.match(/(?:Belast\. E-Banking|Vergütung|Gutschrift)\s+(.*)/);
  if(m) return m[1].replace(/\s*[0-9a-f]{32}\s*$/,'').trim();
  return info.slice(0,60).trim();
}
function channel(info){
  if(info.startsWith('Einkauf Debitkarte')) return 'Debitkarte';
  if(info.startsWith('TWINT')) return 'TWINT';
  if(/^(Bancomat|Bezug)/.test(info)) return 'Bancomat';
  if(/^(Belast\. E-Banking|Zahlungsauftrag|Vergütung)/.test(info)) return 'E-Banking';
  if(info.startsWith('Gutschrift')||info.startsWith('Salär')) return 'Gutschrift';
  if(/^(Habenzins|Dividende|Spesen|Preis|VST|Kontoführung)/.test(info)) return 'Bank';
  return 'Sonstige';
}
function categorize(info, cp, cpIban, amt){
  const debit = amt < 0;
  const name = merchantRaw(info, cp);
  const hay = name + ' | ' + info + ' | ' + (cp||'');
  if(OWN_ANALYZED.has(cpIban))
    return ['Interner Übertrag','Zwischen eigenen Konten','Eigenübertrag','transfer_internal'];
  if(OWN_EXTERNAL[cpIban] || /Kaspar&/.test(info)){
    const lbl = OWN_EXTERNAL[cpIban] || 'Kaspar& (Sparen-App)';
    return ['Sparen & Anlegen', lbl, lbl, debit?'transfer_savings':'savings_return'];
  }
  if(channel(info)==='Bancomat') return ['Bargeldbezug','Bancomat','Bancomat '+name.slice(0,20),'expense'];
  for(const [pat,cat,sub] of DB.customRules){
    try{ if(new RegExp(pat,'i').test(hay)) return [cat,sub,name, debit?'expense':'income']; }catch(e){}
  }
  if(debit){
    if(info.startsWith('TWINT') && /\+41\d{9}/.test(info)) return ['TWINT an Privatpersonen','P2P-Zahlung',name,'expense'];
    for(const [pat,main,sub,disp] of RULES){
      if(new RegExp(pat,'i').test(hay)) return [main,sub,disp||name, main==='Sparen & Anlegen'?'transfer_savings':'expense'];
    }
    if(cp && channel(info)==='E-Banking' && !/AG$|GmbH|Genossenschaft|amt|Gemeinde/.test(cp))
      return ['Überweisung an Privatpersonen','E-Banking',cp,'expense'];
    return ['Sonstiges','Nicht zugeordnet',name,'expense'];
  } else {
    if(info.startsWith('TWINT') && /\+41\d{9}/.test(info)) return ['TWINT von Privatpersonen','P2P-Eingang',name,'income'];
    if(/capital\.com/i.test(hay)) return ['Sparen & Anlegen','Trading (Capital.com)','Capital.com','savings_return'];
    for(const [pat,main] of INCOME_RULES){
      if(new RegExp(pat,'i').test(hay)) return [main,main,name,'income'];
    }
    if(info.startsWith('Spesen')) return ['Rückerstattungen/Sonstiges','Spesenkorrektur','Bank','income'];
    if(info.startsWith('Gutschrift') && info.includes('Kartennummer')) return ['Rückerstattungen/Sonstiges','Karten-Rückerstattung',name,'income'];
    return ['Sonstige Einnahmen','Nicht zugeordnet',name,'income'];
  }
}

const seen = new Set(DB.tx.map(t=>t[9]));
function parseCamt(xmlText){
  const doc = new DOMParser().parseFromString(xmlText,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('XML nicht lesbar');
  const q = (el,name)=>{ const r=[]; for(const e of el.getElementsByTagName('*')){ if(e.localName===name) r.push(e);} return r; };
  const txt = (el,path)=>{ let cur=[el]; for(const p of path.split('/')){ let nxt=[]; for(const c of cur){ for(const ch of c.children){ if(ch.localName===p) nxt.push(ch);} } cur=nxt; if(!cur.length) return ''; } return (cur[0].textContent||'').trim(); };
  let added=0, accountsTouched=[];
  for(const stmt of q(doc.documentElement,'Stmt')){
    const iban = txt(stmt,'Acct/Id/IBAN');
    const acctName = txt(stmt,'Acct/Tp/Prtry').split('/')[0].trim() || iban.slice(-4);
    if(!DB.accounts[iban]){ DB.accounts[iban] = {name:acctName, open:null}; OWN_ANALYZED.add(iban); }
    accountsTouched.push(acctName);
    for(const bal of q(stmt,'Bal')){
      const code = txt(bal,'Tp/CdOrPrtry/Cd');
      const dt = txt(bal,'Dt/Dt');
      const v = parseFloat(txt(bal,'Amt')) * (txt(bal,'CdtDbtInd')==='CRDT'?1:-1);
      if(code==='OPBD' && (!DB.accounts[iban].open || dt < DB.accounts[iban].open[0])) DB.accounts[iban].open=[dt,v];
    }
    for(const ntry of q(stmt,'Ntry')){
      const amt = parseFloat(txt(ntry,'Amt')) * (txt(ntry,'CdtDbtInd')==='CRDT'?1:-1);
      const date = txt(ntry,'BookgDt/Dt');
      const ref = txt(ntry,'AcctSvcrRef');
      const info = txt(ntry,'AddtlNtryInf');
      const key = iban+'|'+ref+'|'+date+'|'+amt.toFixed(2);
      if(seen.has(key)) continue;
      seen.add(key);
      let cp='', cpIban='';
      const tds = q(ntry,'TxDtls');
      if(tds.length){
        const td=tds[0];
        if(amt<0){ cp=txt(td,'RltdPties/Cdtr/Pty/Nm')||txt(td,'RltdPties/Cdtr/Nm'); cpIban=txt(td,'RltdPties/CdtrAcct/Id/IBAN'); }
        else { cp=txt(td,'RltdPties/Dbtr/Pty/Nm')||txt(td,'RltdPties/Dbtr/Nm'); cpIban=txt(td,'RltdPties/DbtrAcct/Id/IBAN'); }
      }
      const [cat,sub,name,flow] = categorize(info,cp,cpIban,amt);
      DB.tx.push([date, Math.round(amt*100)/100, iban, channel(info), cat, sub, name, flow, info.slice(0,140), key]);
      added++;
    }
  }
  return {added, accountsTouched};
}
async function handleFiles(files){
  let tot=0, accs=new Set(), errs=[];
  for(const f of files){
    try{
      if(f.name.toLowerCase().endsWith('.zip')){
        const zip = await JSZip.loadAsync(f);
        for(const nm of Object.keys(zip.files)){
          if(nm.toLowerCase().endsWith('.xml')){
            const r = parseCamt(await zip.files[nm].async('string'));
            tot+=r.added; r.accountsTouched.forEach(a=>accs.add(a));
          }
        }
      } else if(f.name.toLowerCase().endsWith('.xml')){
        const r = parseCamt(await f.text());
        tot+=r.added; r.accountsTouched.forEach(a=>accs.add(a));
      } else errs.push(f.name+': kein XML/ZIP');
    }catch(e){ errs.push(f.name+': '+e.message); }
  }
  DB.tx.sort((a,b)=>a[0]<b[0]?-1:1);
  if(tot>0) markDirty();
  renderAll();
  toast(`${tot} neue Transaktionen importiert${accs.size?' ('+[...accs].join(', ')+')':''}. ${errs.length?' '+errs.join('; '):''}`);
}

function allMonths(){ return [...new Set(DB.tx.map(t=>t[0].slice(0,7)))].sort(); }
function inPeriod(t){ const m=t[0].slice(0,7); return (!S.from||m>=S.from)&&(!S.to||m<=S.to); }

function setPreset(p){
  const ms=allMonths(); const last=ms[ms.length-1];
  S.preset=p;
  if(p==='all'){S.from=null;S.to=null;}
  else if(p==='12'){S.from=ms[Math.max(0,ms.length-12)];S.to=last;}
  else if(p==='6'){S.from=ms[Math.max(0,ms.length-6)];S.to=last;}
  else if(p==='3'){S.from=ms[Math.max(0,ms.length-3)];S.to=last;}
  else if(/^\d{4}$/.test(p)){S.from=p+'-01';S.to=p+'-12';}
  renderAll();
}
function aggregates(txs){
  const A = {inc:0, exp:0, sav:0, byCat:{}, bySub:{}, byMonth:{}, incByCat:{}, merch:{}, monthsCatExp:{}, byDay:{}, nByCat:{}};
  for(const t of txs){
    const [d,amt,acct,ch,cat,sub,name,flow] = t;
    const m = d.slice(0,7);
    if(!A.byMonth[m]) A.byMonth[m]={inc:0,exp:0,sav:0};
    if(flow==='transfer_internal') continue;
    if(flow==='transfer_savings'||flow==='savings_return'){ A.sav-=amt; A.byMonth[m].sav-=amt; continue; }
    if(amt>0){ A.inc+=amt; A.byMonth[m].inc+=amt; A.incByCat[cat]=(A.incByCat[cat]||0)+amt; }
    else{
      A.exp-=amt; A.byMonth[m].exp-=amt;
      A.byCat[cat]=(A.byCat[cat]||0)-amt; A.nByCat[cat]=(A.nByCat[cat]||0)+1;
      const sk=cat+'||'+sub; A.bySub[sk]=(A.bySub[sk]||0)-amt;
      A.byDay[d]=(A.byDay[d]||0)-amt;
      if(!['TWINT an Privatpersonen','Bargeldbezug','Überweisung an Privatpersonen'].includes(cat)){
        if(!A.merch[name]) A.merch[name]={n:0,tot:0,cat};
        A.merch[name].n++; A.merch[name].tot-=amt;
      }
      if(!A.monthsCatExp[m]) A.monthsCatExp[m]={};
      A.monthsCatExp[m][cat]=(A.monthsCatExp[m][cat]||0)-amt;
    }
  }
  A.months = Object.keys(A.byMonth).sort();
  A.nMonths = Math.max(1, A.months.length);
  return A;
}
function balanceSeries(){
  const per = {};
  for(const [iban,acc] of Object.entries(DB.accounts)){
    if(!acc.open) continue;
    const txs = DB.tx.filter(t=>t[2]===iban).sort((a,b)=>a[0]<b[0]?-1:1);
    let cur = acc.open[1]; const monthly={};
    for(const t of txs){ cur+=t[1]; monthly[t[0].slice(0,7)]=Math.round(cur*100)/100; }
    per[iban]={name:acc.name, monthly, final:Math.round(cur*100)/100, from:acc.open[0], to:txs.length?txs[txs.length-1][0]:acc.open[0], openVal:acc.open[1]};
  }
  const allM = [...new Set([].concat(...Object.values(per).map(p=>Object.keys(p.monthly))))].sort();
  const lastVals = {}; for(const ib of Object.keys(per)) lastVals[ib]=per[ib].openVal;
  const comb=[];
  const savCum=[]; let sc=0;
  const savByM={};
  for(const t of DB.tx){ if(t[7]==='transfer_savings'||t[7]==='savings_return'){ const m=t[0].slice(0,7); savByM[m]=(savByM[m]||0)-t[1]; } }
  for(const m of allM){
    let s=0;
    for(const ib of Object.keys(per)){ if(per[ib].monthly[m]!==undefined) lastVals[ib]=per[ib].monthly[m]; s+=lastVals[ib]; }
    sc += savByM[m]||0;
    comb.push([m, Math.round(s*100)/100]);
    savCum.push(Math.round(sc*100)/100);
  }
  return {per, comb, allM, savCum};
}

function spark(id, data, color){
  const c=document.getElementById(id); if(!c||!c.getContext) return;
  let ctx; try{ ctx=c.getContext('2d'); }catch(e){ return; }
  if(!ctx) return;
  const dpr=window.devicePixelRatio||1; const w=c.clientWidth||260, h=34;
  c.width=w*dpr; c.height=h*dpr;
  const x=ctx; x.scale(dpr,dpr);
  if(data.length<2) return;
  const mn=Math.min(...data,0), mx=Math.max(...data,1);
  const px=i=>i/(data.length-1)*(w-4)+2, py=v=>h-3-(v-mn)/(mx-mn||1)*(h-8);
  x.beginPath(); x.moveTo(px(0),py(data[0]));
  data.forEach((v,i)=>x.lineTo(px(i),py(v)));
  x.strokeStyle=color; x.lineWidth=1.8; x.stroke();
  x.lineTo(px(data.length-1),h); x.lineTo(px(0),h); x.closePath();
  x.fillStyle=color+'22'; x.fill();
}

/* ---------- Ausreisser (robust: Median/IQR pro Kategorie) ---------- */
function q(sorted,p){ if(!sorted.length) return 0; const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo); }
function computeOutliers(txs){
  const byCat={};
  for(const t of txs){ if(t[7]!=='expense') continue; (byCat[t[4]]=byCat[t[4]]||[]).push(t); }
  const res=[];
  for(const [cat,arr] of Object.entries(byCat)){
    const vals=arr.map(t=>-t[1]).sort((a,b)=>a-b);
    const med=q(vals,.5), q1=q(vals,.25), q3=q(vals,.75);
    const iqr=Math.max(q3-q1, med*.25, 1);
    const thr = vals.length>=6 ? Math.max(q3+3*iqr, med*4, 40) : 400;
    for(const t of arr){ const a=-t[1]; if(a>=thr) res.push({t, med, thr, factor: med>0? a/med : null}); }
  }
  res.sort((x,y)=>x.t[1]-y.t[1]);
  return res;
}
function monthSpikes(A){
  const out=[];
  for(const cat of Object.keys(A.byCat)){
    const series=A.months.map(m=>(A.monthsCatExp[m]&&A.monthsCatExp[m][cat])||0);
    const nz=series.filter(v=>v>0).sort((a,b)=>a-b);
    if(nz.length<3) continue;
    const med=q(nz,.5);
    A.months.forEach((m,i)=>{ const v=series[i]; if(v>Math.max(2.5*med,250)&&(v-med)>200) out.push({cat,m,v,med}); });
  }
  return out.sort((a,b)=>b.v-a.v);
}

/* ---------- Drilldown ---------- */
function drill(cat){ showView('transaktionen'); const c=document.getElementById('fCat'); if(c){c.value=cat;} const s=document.getElementById('fSearch'); if(s)s.value=''; txPage=0; drawTx(); }
function drillSearch(q){ showView('transaktionen'); const c=document.getElementById('fCat'); if(c)c.value=''; const s=document.getElementById('fSearch'); if(s)s.value=q; txPage=0; drawTx(); }
function wipeAll(){
  if(!confirm('Wirklich ALLE Daten löschen (Transaktionen, Konten, Budgets, Regeln)? Das betrifft nur diese Datei.')) return;
  DB.tx=[]; DB.accounts={}; DB.budgets={}; DB.customRules=[]; seen.clear(); OWN_ANALYZED.clear();
  markDirty(); renderAll(); showView('import');
  toast('Alle Daten gelöscht. Mit «Aktualisierte Datei speichern» bleibt der leere Zustand erhalten.');
}
function delRule(i){ DB.customRules.splice(i,1); markDirty(); renderAll(); showView('import'); }

/* ---------- Transaktionstabelle ---------- */
let txPage=0;
function renderTxTable(){
  const v=document.getElementById('v-transaktionen');
  const cats=[...new Set(DB.tx.map(t=>t[4]))].sort();
  const accs=Object.entries(DB.accounts);
  const keepCat=document.getElementById('fCat')?.value||'', keepQ=document.getElementById('fSearch')?.value||'';
  v.innerHTML=`<div class="card">
  <div class="controls">
    <input type="search" id="fSearch" placeholder="Suche Händler, Text …" value="${esc(keepQ)}">
    <select id="fCat"><option value="">Alle Kategorien</option>${cats.map(c=>`<option ${c===keepCat?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <select id="fAcc"><option value="">Alle Konten</option>${accs.map(([ib,a])=>`<option value="${ib}">${esc(a.name)}</option>`).join('')}</select>
    <select id="fFlow"><option value="">Alle Typen</option><option value="expense">Ausgaben</option><option value="income">Einnahmen</option><option value="transfer_savings">Sparen &amp; Anlegen</option><option value="transfer_internal">Interne Überträge</option></select>
    <select id="fSort"><option value="d">Neueste zuerst</option><option value="a">Grösste Beträge</option></select>
    <button class="btn sec sm" onclick="exportCSV()">${I_DL} CSV</button>
  </div>
  <div id="txBody"></div><div class="pager"><button id="pPrev">‹</button><span id="pInfo"></span><button id="pNext">›</button></div></div>`;
  ['fSearch','fCat','fAcc','fFlow','fSort'].forEach(id=>document.getElementById(id).oninput=()=>{txPage=0;drawTx();});
  document.getElementById('pPrev').onclick=()=>{txPage=Math.max(0,txPage-1);drawTx();};
  document.getElementById('pNext').onclick=()=>{txPage++;drawTx();};
  drawTx();
}
function txFiltered(){
  const q=(document.getElementById('fSearch')?.value||'').toLowerCase();
  const fc=document.getElementById('fCat')?.value||'', fa=document.getElementById('fAcc')?.value||'', ff=document.getElementById('fFlow')?.value||'';
  return fTx().filter(t=>(!fc||t[4]===fc)&&(!fa||t[2]===fa)&&(!ff||t[7]===ff||(ff==='transfer_savings'&&t[7]==='savings_return'))&&(!q||(t[6]+' '+t[8]+' '+t[5]).toLowerCase().includes(q)));
}
function drawTx(){
  const srt=document.getElementById('fSort')?.value||'d';
  let rows=txFiltered();
  rows = srt==='a' ? [...rows].sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])) : [...rows].sort((x,y)=>x[0]<y[0]?1:-1);
  const PP=50, maxP=Math.max(1,Math.ceil(rows.length/PP)); if(txPage>=maxP)txPage=maxP-1;
  const pg=rows.slice(txPage*PP,(txPage+1)*PP);
  const sum=rows.reduce((s,t)=>s+t[1],0);
  document.getElementById('txBody').innerHTML=`<table><tr><th>Datum</th><th>Händler</th><th>Kategorie</th><th>Kanal</th><th class="r">Betrag (CHF)</th><th></th></tr>
  ${pg.map(t=>{const gi=DB.tx.indexOf(t);return `<tr title="${esc(t[8])}"><td>${fmtD(t[0])}</td><td><b>${esc(t[6].slice(0,38))}</b><div class="small">${esc(t[5])}</div></td><td><span class="tag">${ico(t[4])} ${esc(t[4])}</span></td><td class="small">${esc(t[3])}</td><td class="r"><b class="${t[1]>=0?'pos':'neg'}">${CHF(t[1])}</b></td><td><button class="btn sec sm" onclick="openEdit(${gi})" title="Umkategorisieren">${I_EDIT}</button></td></tr>`;}).join('')}</table>`;
  document.getElementById('pInfo').textContent=`Seite ${txPage+1}/${maxP} · ${rows.length} Transaktionen · Summe ${CHF(sum)}`;
}
function exportCSV(){
  const rows=txFiltered().sort((x,y)=>x[0]<y[0]?-1:1);
  const head='Datum;Konto;Betrag;Typ;Hauptkategorie;Unterkategorie;Haendler;Kanal;Beschreibung\n';
  const FLOW={expense:'Ausgabe',income:'Einnahme',transfer_internal:'Interner Übertrag',transfer_savings:'Sparen & Anlegen',savings_return:'Rückfluss Anlagen'};
  const body=rows.map(t=>[t[0],DB.accounts[t[2]]?.name||t[2],String(t[1]).replace('.',','),FLOW[t[7]]||t[7],t[4],t[5],t[6],t[3],(t[8]||'').replace(/;/g,',')].join(';')).join('\n');
  const blob=new Blob(['﻿'+head+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='transaktionen_export.csv'; a.click();
  toast('CSV exportiert ('+rows.length+' Zeilen).');
}

  editIdx=i; const t=DB.tx[i];
  document.getElementById('edInfo').textContent=`${fmtD(t[0])} · ${CHF(t[1])} CHF · ${t[8].slice(0,90)}`;

  sel.innerHTML=cats.map(c=>`<option ${c===t[4]?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new__"> Neue Kategorie …</option>';
  const dl=document.getElementById('subList');
  const refreshSubs=()=>{ const subs=[...new Set(DB.tx.filter(x=>x[4]===sel.value).map(x=>x[5]))].sort(); dl.innerHTML=subs.map(s=>`<option value="${esc(s)}">`).join(''); };
  sel.onchange=()=>{ if(sel.value==='__new__'){ const nc=prompt('Name der neuen Kategorie:'); if(nc){ sel.innerHTML=`<option selected>${esc(nc)}</option>`+sel.innerHTML; sel.value=nc; } else sel.value=t[4]; } refreshSubs(); };
  refreshSubs();
  document.getElementById('edSub').value=t[5];
  document.getElementById('edRule').checked=false;
  editDlg.showModal();
}
document.getElementById('edSave').onclick=()=>{
  const t=DB.tx[editIdx];
  const cat=document.getElementById('edCat').value, sub=document.getElementById('edSub').value||cat;
  const asRule=document.getElementById('edRule').checked;
  if(asRule){
    const pat=t[6].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    DB.customRules.push([pat,cat,sub]);
    let n=0;
    for(const x of DB.tx){ if(x[6]===t[6] && x[7]===t[7]){ x[4]=cat; x[5]=sub; n++; } }
    toast(`Regel erstellt – ${n} Transaktionen umkategorisiert.`);
  } else { t[4]=cat; t[5]=sub; }
  markDirty(); editDlg.close(); renderAll(); showView('transaktionen');
};

nav(); renderAll(); runCountUps(document.getElementById('v-uebersicht')); if(!DB.tx.length) showView('import');
</script>
